[project]
name = "triple-extraction"
version = "0.1.0"
description = "REBEL triple extraction HTTP API (sentence-level, GPU-first)"
readme = "README.md"
authors = [
    { email = "namthip.ct06@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "spacy>=3.8.16",
    "transformers==4.52.4",
    "torch>=2.7",
]

[tool.uv]
package = false

# RTX 5060 Ti เป็น Blackwell (sm_120) — ต้องใช้ torch build สำหรับ CUDA 12.8+
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.28",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
